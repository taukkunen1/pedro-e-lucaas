name: CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build, self-test and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select build configuration
        shell: pwsh
        run: |
          $configuration = "Debug"
          $environmentName = "development"

          if ("${{ github.ref }}" -eq "refs/heads/main" -or "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $configuration = "Release"
            $environmentName = "production"
          }

          "BUILD_CONFIGURATION=$configuration" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_ENVIRONMENT=$environmentName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLACEBO_DIR=$env:RUNNER_TEMP\Placebo" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Environment: $environmentName"
          Write-Host "Configuration: $configuration"

      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
            "COServer/DFAccountServer/AccountServer.csproj",
            "COServer/DFGameServer/GameServer.csproj",
            "COServer/DFAPI/API.csproj"
          )

          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Economy V4 static audit
        shell: pwsh
        run: |
          python tools/era1_economy_v4_audit.py --check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build and publish
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:RUNNER_TEMP "publish"

          if (Test-Path $publishRoot) {
            Remove-Item $publishRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $publishRoot | Out-Null

          $projects = @(
            @("COServer/DFAccountServer/AccountServer.csproj", "AccountServer"),
            @("COServer/DFGameServer/GameServer.csproj", "GameServer"),
            @("COServer/DFAPI/API.csproj", "API")
          )

          foreach ($project in $projects) {
            $destination = Join-Path $publishRoot $project[1]

            dotnet publish $project[0] -c $env:BUILD_CONFIGURATION --no-restore -o $destination
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          if ($env:BUILD_ENVIRONMENT -eq "development") {
            Copy-Item "COServer/Database5700" (Join-Path $publishRoot "Database5700") -Recurse
          }

      - name: Era 1 promotion self-test
        shell: pwsh
        run: |
          dotnet run --project "COServer/DFGameServer/GameServer.csproj" -c $env:BUILD_CONFIGURATION --no-restore -- era1-selftest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:RUNNER_TEMP "publish"
          $zipPath = Join-Path $env:RUNNER_TEMP "TrinityConquer-$env:BUILD_ENVIRONMENT-${{ github.sha }}.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$publishRoot\*" -DestinationPath $zipPath
          "ARTIFACT_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrinityConquer-${{ github.sha }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          generate_release_notes: true
