name: Temporary 5695 packet build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore COServer/DFGameServer/GameServer.csproj

      - name: Build GameServer
        run: dotnet build COServer/DFGameServer/GameServer.csproj -c Release --no-restore

      - name: Upload patched DLLs
        uses: actions/upload-artifact@v4
        with:
          name: TrinityConquer-5695-packet-dlls
          if-no-files-found: error
          path: |
            COServer/DFGameServer/bin/Release/net10.0/GameServer.dll
            COServer/DFGameServer/bin/Release/net10.0/GameServer.pdb
            COServer/DFCore/bin/Release/net10.0/Core.dll
            COServer/DFCore/bin/Release/net10.0/Core.pdb
