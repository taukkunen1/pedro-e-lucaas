name: Auto Hunt V2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/original-vip-autohunt
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore COServer/DFGameServer/GameServer.csproj
      - name: Build
        run: dotnet build COServer/DFGameServer/GameServer.csproj --configuration Debug --no-restore
